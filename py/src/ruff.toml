# Ruff configuration for bbsengine6

[lint]
# F541: f-string without any placeholders - we use f-strings for io.echo() calls
# to support echo commands like {restorecursor}, {savecursor}, etc.
# ANN401: Dynamically typed expressions - we use Any for kwargs and database connections
# E402: Module level import not at top of file - getch.py must install signal handlers
# before importing bbsengine6 modules (conditional imports for graceful fallback)
# F403: Star imports used in legacy output.py and input.py - intentional for compatibility
# F405: Variables from star imports in legacy files - acceptable pattern
# F811: Redefinition of ctrl_key_name in input.py - existing duplicate function
# F841: Unused local variables - legacy code pattern in input.py and output.py
ignore = ["F541", "ANN401", "E402", "F403", "F405", "F811", "F841"]

[lint.per-file-ignores]
"*/io/input.py" = ["F841"]
"*/io/output.py" = ["F841"]
"*/io/inputstring.py" = ["F841"]
