[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbsengine6"
dynamic = ["version"]
requires-python = ">=3.9,<3.13"
license = "GPL-2.0-or-later"
authors = [
    { name = "bbsengine.org", email = "bbsengine6@projects.zoidtechnologies.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: BBS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "argcomplete",
    "getdate-next",
    "markdown",
    "psycopg[binary,pool]",
    "psycopg-pool",
    "python-dateutil",
    "websockets",
]

[project.scripts]
bed = "bbsengine6.bed:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://bbsengine.org/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bbsengine6*"]

[tool.setuptools.dynamic]
version = { attr = "bbsengine6._version.__version__" }

[tool.setuptools.package-data]
bbsengine6 = ["sql/*.sql", "sql/Makefile"]

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (no database required)",
    "integration: marks tests as integration tests (require networking)",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "off"
reportMissingTypeHints = false
reportGeneralTypeIssues = false
reportTypedDictItemRequired = false
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportReturnType = false
reportUnionConsistency = false
reportUnknownVariableType = false
reportUnknownMemberType = false
include = ["src"]
exclude = ["**/__pycache__", "**/tests"]
